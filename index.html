<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Trespasser</title>
<!-- The front end's first screens, fetched ahead of the level's hundreds of files so a
     fresh visit shows them at once rather than after the queue. -->
<link rel="preload" href="menu/layouts.json" as="fetch" crossorigin>
<link rel="preload" href="menu/splash.png" as="image" fetchpriority="high">
<link rel="preload" href="menu/ms_bkgnd.png" as="image" fetchpriority="high">
<link rel="preload" href="menu/ms_new_0.png" as="image">
<link rel="preload" href="menu/ms_load_0.png" as="image">
<link rel="preload" href="menu/ms_options_0.png" as="image">
<link rel="preload" href="menu/ms_credits_0.png" as="image">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  :root { --ink: #f2eee0; --dim: #b9b39a; --blood: #b3261e; --edge-l: max(16px, env(safe-area-inset-left)); --edge-r: max(16px, env(safe-area-inset-right));
          --edge-t: max(12px, env(safe-area-inset-top)); --edge-b: max(24px, env(safe-area-inset-bottom)); }
  #hud { position: fixed; inset: 0; pointer-events: none; font: 600 15px/1.3 -apple-system, "Segoe UI", sans-serif; color: var(--ink);
         text-shadow: 0 1px 3px #000; visibility: hidden; }
  body.playing #hud { visibility: visible; }
  #hp { position: absolute; left: var(--edge-l); top: var(--edge-t); display: flex; align-items: center; gap: 8px; }
  #hp .bar { width: 140px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.45); box-shadow: 0 0 0 1px rgba(255,255,255,.25); overflow: hidden; }
  #hp .bar i { display: block; height: 100%; width: 100%; background: #d8cfa8; transition: width .25s ease-out; }
  #hp b { font-variant-numeric: tabular-nums; min-width: 2.2em; }
  #hp.low .bar i { background: #d33a2c; }
  #hp.low b { color: #ff8a7a; }
  #weapon { position: absolute; right: var(--edge-r); top: var(--edge-t); font-variant-numeric: tabular-nums; }
  #weapon b { margin-left: 6px; font-size: 18px; }
  #weapon .none { color: var(--dim); font-weight: 500; }
  #hint { position: absolute; left: 50%; top: calc(var(--edge-t) + 34px); transform: translateX(-50%); max-width: min(80vw, 560px); text-align: center;
          padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .3s; }
  #hint.on { opacity: 1; }
  #hint:empty { display: none; }
  /* Level text from the triggers ("To move forward, push the left stick."). */
  #trigger-text { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); max-width: min(90vw, 720px); z-index: 30;
                  padding: 6px 14px; font: 600 clamp(14px, 2.2vw, 20px)/1.35 Georgia, "Times New Roman", serif; text-align: center;
                  text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  /* Damage: red edges that flash on a hit, and a slow heartbeat below 30 health. */
  .vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0;
              background: radial-gradient(ellipse at center, transparent 45%, rgba(150,0,0,.55) 80%, rgba(110,0,0,.9) 100%); }
  #lowhp.on { opacity: .5; animation: heartbeat 1.1s ease-in-out infinite; }
  @keyframes hurt { to { opacity: 0; } }
  @keyframes heartbeat { 0%, 100% { opacity: .45; } 15% { opacity: .95; } 30% { opacity: .55; } 45% { opacity: .85; } }
  @keyframes shake {
    0% { transform: translate(0, 0) scale(1.03); } 20% { transform: translate(-9px, 5px) scale(1.03); } 40% { transform: translate(8px, -6px) scale(1.03); }
    60% { transform: translate(-5px, -3px) scale(1.03); } 80% { transform: translate(3px, 4px) scale(1.03); } 100% { transform: translate(0, 0) scale(1); } }
  /* The original front end (src/frontend.js): windows from the .ddf layouts at their
     640x480 / 320x200 pixel coordinates, scaled from the centre of the screen. */
  #loading { display: none; }   /* main.js's progress text; the loader screen reads it */
  #fe { position: fixed; inset: 0; z-index: 20; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #fe[hidden] { display: none; }
  #fe.opaque { background: #000; }
  #fe.dim { background: rgba(0, 0, 0, .35); }
  #fe .fe-shield { position: absolute; inset: 0; }
  .fe-win { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; font-family: Arial, Helvetica, sans-serif; color: #fff; }
  .fe-win > * { position: absolute; }
  .fe-win [hidden] { display: none !important; }
  .fe-win img { display: block; -webkit-user-drag: none; }
  .fe-button { cursor: pointer; touch-action: none; }
  .fe-button.disabled, .fe-check.disabled { opacity: .45; cursor: default; }
  .fe-text { display: flex; line-height: 1.15; overflow: hidden; pointer-events: none;
             text-shadow: 1px 1px 0 #000; }   /* "back lit" text: a black copy one pixel down-right */
  .fe-text.border { box-shadow: inset 0 0 0 1px #9a9a9a; padding: 0 3px; box-sizing: border-box; }
  .fe-blink { animation: fe-blink 1.4s ease-in-out infinite; }
  @keyframes fe-blink { 50% { opacity: .35; } }
  .fe-list { font-size: 12px; text-shadow: 1px 1px 0 #000; }
  .fe-list .rows { position: absolute; inset: 0 17px 0 0; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; touch-action: pan-y; }
  .fe-list .rows::-webkit-scrollbar { display: none; }
  .fe-list .row { padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; line-height: 14px; }
  .fe-list .row.sel { background: #808080; }
  .fe-win.bare .fe-list { background: #808080; }   /* no plate behind it: the listbox's own grey */
  .fe-list .arrow { position: absolute; right: 0; cursor: pointer; }
  .fe-list .arrow.up { top: 0; } .fe-list .arrow.dn { bottom: 0; }
  .fe-check { cursor: pointer; }
  .fe-hot { cursor: pointer; }
  .fe-slider { cursor: pointer; touch-action: none; }
  .fe-slider .thumb { position: absolute; top: 0; }
  .fe-progress i { position: absolute; inset: 0; transform-origin: 0 50%; will-change: transform; }
  .fe-restoring { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: #000; color: #fff;
                  font: 16px Arial, Helvetica, sans-serif; text-shadow: 1px 1px 0 #000; padding: 0 24px; text-align: center; }
  #fe-video { position: fixed; inset: 0; z-index: 30; background: #000; cursor: pointer; }
  /* 640x348 at 15 fps and 256 colours: no bigger than twice native (a 1280x960 box), smooth-scaled.
     On a phone it fills the screen's width (or height, whichever fits first). */
  #fe-video video { position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; max-width: 1280px; max-height: 960px; object-fit: contain; image-rendering: auto; }
  @media (pointer: coarse) { #fe-video video { max-width: none; max-height: none; } }
  /* Touch layout, one plan for every control (phones in landscape down to 667x375 or
     shorter with browser bars, notches, iPads):
       top-left      health                    top-right  weapon · ? · pause
       top centre    level text, then the HUD hint, small, clear of the middle of the view
       bottom-left   left stick                bottom-right  right stick, with FIRE (biggest),
                                                             GRAB and JUMP in an arc round its upper left
       bottom, left of JUMP: the secondary pills (#handpad: CROUCH, and THROW / STOW only
       when they apply; HAND / ROTATE for the classic hand), two rows at most.
     Button centres sit on circles about the right stick's centre, so they keep their
     gaps whatever the sizes; sizes step down on short screens, never below 44 px. */
  :root { --stick: 120px; --fire: 76px; --btn: 58px; --pill: 44px; --arc-gap: 10px; }
  @media (max-height: 360px) { :root { --stick: 108px; --fire: 68px; --btn: 52px; } }
  @media (min-height: 640px) { :root { --stick: 150px; --fire: 92px; --btn: 70px; --pill: 50px; } }
  .stick { position: fixed; bottom: var(--edge-b); width: var(--stick); height: var(--stick); border-radius: 50%;
           border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.15); display: none; box-sizing: border-box; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #stickL { left: var(--edge-l); }
  #stickR { right: var(--edge-r); }
  body.touch .stick { display: block; }
  .btn { position: fixed; width: var(--btn); height: var(--btn); border-radius: 50%; border: 2px solid rgba(255,255,255,.3); background: rgba(0,0,0,.25);
         color: #f2eee0; font: 700 13px -apple-system, sans-serif; display: none; place-items: center; letter-spacing: .04em; padding: 0; box-sizing: border-box;
         -webkit-user-select: none; user-select: none; touch-action: none; }
  body.touch .btn { display: grid; }
  /* Arc: angle θ from the stick's centre (0° = right, 90° = up), radius = stick/2 + gap + size/2.
     FIRE at 100°, GRAB at 145°, JUMP at 192°. */
  #btn-fire { width: var(--fire); height: var(--fire); font-size: 15px;
              right: calc(var(--edge-r) + var(--stick) / 2 + 0.1736 * (var(--stick) / 2 + var(--arc-gap) + var(--fire) / 2) - var(--fire) / 2);
              bottom: calc(var(--edge-b) + var(--stick) / 2 + 0.9848 * (var(--stick) / 2 + var(--arc-gap) + var(--fire) / 2) - var(--fire) / 2); }
  #btn-grab { right: calc(var(--edge-r) + var(--stick) / 2 + 0.8192 * (var(--stick) / 2 + var(--arc-gap) + var(--btn) / 2) - var(--btn) / 2);
              bottom: calc(var(--edge-b) + var(--stick) / 2 + 0.5736 * (var(--stick) / 2 + var(--arc-gap) + var(--btn) / 2) - var(--btn) / 2); }
  #btn-jump { right: calc(var(--edge-r) + var(--stick) / 2 + 0.9781 * (var(--stick) / 2 + var(--arc-gap) + var(--btn) / 2) - var(--btn) / 2);
              bottom: calc(var(--edge-b) + var(--stick) / 2 - 0.2079 * (var(--stick) / 2 + var(--arc-gap) + var(--btn) / 2) - var(--btn) / 2); }
  /* Top-right corner: pause, and the hint "?" beside it (triggers.js). */
  #btn-pause, #btn-help { top: var(--edge-t); bottom: auto; width: 44px; height: 44px; font-size: 13px; }
  #btn-pause { right: var(--edge-r); }
  #btn-help { right: calc(var(--edge-r) + 52px); font: 700 20px Georgia, serif; z-index: 31; }
  body.touch #weapon { right: calc(var(--edge-r) + 108px); top: calc(var(--edge-t) + 11px); }
  /* Secondary actions (hand.js): pills left of JUMP along the bottom, filling from the right. */
  #handpad { position: fixed; display: none; z-index: 20; bottom: var(--edge-b);
             right: calc(var(--edge-r) + var(--stick) / 2 + 0.9781 * (var(--stick) / 2 + var(--arc-gap) + var(--btn) / 2) + var(--btn) / 2 + 12px);
             width: calc(3 * 64px + 2 * 8px); flex-wrap: wrap-reverse; justify-content: flex-end; align-content: flex-start; gap: 8px; }
  body.touch.playing #handpad { display: flex; }
  #handpad button { width: 64px; height: var(--pill); border-radius: calc(var(--pill) / 2); border: 1px solid rgba(255,255,255,.45);
                    background: rgba(0,0,0,.35); color: #fff; font: 600 11px/1 system-ui, sans-serif; letter-spacing: .06em; padding: 0;
                    -webkit-user-select: none; user-select: none; touch-action: none; }
  #handpad button.on { background: rgba(255,210,120,.55); color: #000; }
  body.modernhand #handpad .classic { display: none; }
  /* Only what applies: THROW while she holds something, STOW with a gun (or one put away). */
  body:not(.holding) #handpad .throw { display: none; }
  body:not(.armed):not(.stowed) #handpad .stow { display: none; }
  /* Text stays high and small on touch, under the top row, clear of the middle of the view. */
  body.touch #trigger-text { top: calc(var(--edge-t) + 50px); max-width: min(56vw, 520px); padding: 2px 10px; font-size: clamp(13px, 1.7vw, 16px); }
  body.touch #hint { top: calc(var(--edge-t) + 102px); max-width: min(50vw, 440px); font-size: 12px; padding: 3px 10px; }
  /* The touch controls only make sense while playing. */
  body.touch:not(.playing) .stick, body.touch:not(.playing) .btn { display: none; }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<div class="vignette" id="lowhp"></div>
<div class="vignette" id="hurt"></div>
<div id="hud"></div>
<div class="stick" id="stickL"><i></i></div>
<div class="stick" id="stickR"><i></i></div>
<div class="btn" id="btn-fire">FIRE</div>
<div class="btn" id="btn-grab">GRAB</div>
<div class="btn" id="btn-jump">JUMP</div>
<div class="btn" id="btn-pause">II</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
